<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>밸런스 게임 - 성향 분석</title>
    <style>
        body { font-family: 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif; margin: 0; padding: 0; background-color: #f4f4f9; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
        header { width: 100%; background-color: #333; color: white; text-align: center; padding: 20px 0; font-size: 24px; font-weight: bold; }
        .container { width: 90%; max-width: 800px; margin: 20px auto; flex: 1; display: flex; flex-direction: column; }
        .question-title { text-align: center; font-size: 28px; font-weight: bold; margin-bottom: 30px; word-break: keep-all; }
        .choices { display: flex; gap: 20px; flex: 1; }
        @media (max-width: 600px) { .choices { flex-direction: column; } }
        .choice-btn { flex: 1; padding: 40px 20px; font-size: 24px; font-weight: bold; color: white; border: none; border-radius: 15px; cursor: pointer; transition: transform 0.2s, box-shadow 0.2s, opacity 0.2s; display: flex; align-items: center; justify-content: center; text-align: center; word-break: keep-all; min-height: 200px; }
        .choice-a { background-color: #3b82f6; }
        .choice-b { background-color: #f97316; }
        .choice-btn:hover { transform: translateY(-5px); box-shadow: 0 10px 20px rgba(0,0,0,0.2); }
        .choice-btn.selected { border: 5px solid #333; transform: scale(1.05); box-shadow: 0 0 20px rgba(0,0,0,0.3); }
        .choice-btn.dimmed { opacity: 0.5; }
        .next-btn, .restart-btn { margin-top: 40px; padding: 15px 40px; font-size: 20px; font-weight: bold; background-color: #10b981; color: white; border: none; border-radius: 10px; cursor: pointer; display: none; align-self: center; }
        .next-btn:hover, .restart-btn:hover { background-color: #059669; }
        .results-container { display: none; flex-direction: column; width: 100%; }
        .personality-result { background: #fff3cd; padding: 20px; border-radius: 10px; margin-bottom: 20px; text-align: center; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .personality-result h2 { margin: 0 0 10px 0; color: #856404; font-size: 26px; }
        .personality-result p { margin: 0; font-size: 18px; color: #664d03; line-height: 1.5; word-break: keep-all; }
        .result-item { background: white; padding: 15px; margin-bottom: 10px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); font-size: 18px; }
        .result-item span { font-weight: bold; color: #e63946; }
        .admin-panel { margin-top: 50px; background: #e2e8f0; padding: 20px; border-radius: 10px; width: 100%; box-sizing: border-box; }
        .admin-panel h3 { margin-top: 0; }
        .admin-panel input, .admin-panel select { width: calc(50% - 15px); padding: 10px; margin-right: 10px; margin-bottom: 10px; border: 1px solid #cbd5e1; border-radius: 5px; box-sizing: border-box; }
        @media (max-width: 600px) { .admin-panel input, .admin-panel select { width: 100%; margin-right: 0; } }
        .admin-panel button { padding: 10px 20px; background-color: #475569; color: white; border: none; border-radius: 5px; cursor: pointer; margin-top: 10px; }
    </style>
</head>
<body>

    <header>밸런스 게임</header>

    <div class="container" id="game-container">
        <div class="question-title" id="question-text">질문이 이곳에 나타납니다.</div>
        
        <div class="choices">
            <button class="choice-btn choice-a" id="btn-a" onclick="selectChoice('A')">선택지 A</button>
            <button class="choice-btn choice-b" id="btn-b" onclick="selectChoice('B')">선택지 B</button>
        </div>

        <button class="next-btn" id="next-btn" onclick="nextQuestion()">다음 질문</button>
        
        <div class="admin-panel" id="admin-panel">
            <h3>직접 질문 추가하기</h3>
            <input type="text" id="input-a" placeholder="선택지 A 입력">
            <select id="type-a">
                <option value="모험가">모험가형</option>
                <option value="안정추구">안정추구형</option>
                <option value="현실주의">현실주의형</option>
                <option value="이상주의">이상주의형</option>
            </select>
            <br>
            <input type="text" id="input-b" placeholder="선택지 B 입력">
            <select id="type-b">
                <option value="안정추구">안정추구형</option>
                <option value="모험가">모험가형</option>
                <option value="이상주의">이상주의형</option>
                <option value="현실주의">현실주의형</option>
            </select>
            <br>
            <button onclick="addCustomQuestion()">추가하기</button>
        </div>
    </div>

    <div class="container results-container" id="results-container">
        <div class="personality-result" id="personality-result">
            <h2 id="personality-title">당신의 성향: 분석 중...</h2>
            <p id="personality-desc">코멘트가 여기에 표시됩니다.</p>
        </div>
        
        <div class="question-title">나의 선택 결과</div>
        <div id="results-list"></div>
        <button class="restart-btn" id="restart-btn" style="display: block; margin: 20px auto;" onclick="restartGame()">다시 하기</button>
    </div>

    <script>
        // ==========================================
        // [1. 성향 결과 코멘트 수정하는 곳]
        // 결과 화면에 나올 성향 이름과 코멘트를 바꿀 수 있습니다.
        // ==========================================
        const personalityData = {
            "모험가": {
                title: "🔥 거침없는 모험가",
                desc: "새로운 도전을 두려워하지 않아요! 일할 때도 번뜩이는 아이디어와 추진력으로 팀을 이끌어가는 스타일이네요."
            },
            "안정추구": {
                title: "🌿 평화로운 안정추구자",
                desc: "돌다리도 두들겨 보고 건너는 신중함! 꼼꼼하고 예측 가능하게 일을 처리해서 주변의 신뢰를 듬뿍 받죠."
            },
            "현실주의": {
                title: "📊 냉철한 현실주의자",
                desc: "가장 효율적이고 확실한 길을 찾아요. 감정보다는 사실과 데이터를 바탕으로 딱 떨어지게 일하는 걸 좋아하네요."
            },
            "이상주의": {
                title: "✨ 낭만적인 이상주의자",
                desc: "가치와 의미를 중요하게 생각해요! 일할 때도 단순히 성과보다는 '왜 이 일을 하는가'에 집중하며 긍정적인 에너지를 뿜어내죠."
            }
        };

        // ==========================================
        // [2. 질문 수정하는 곳]
        // 질문 내용과 각 선택지의 성향(typeA, typeB)을 바꿀 수 있습니다.
        // ==========================================
        let defaultQuestions = [
            { a: "평생 라면만 먹기", typeA: "모험가", b: "평생 치킨만 먹기", typeB: "안정추구" },
            { a: "100억 받고 스마트폰 없이 살기", typeA: "이상주의", b: "그냥 지금처럼 살기", typeB: "현실주의" },
            { a: "과거로 돌아가기", typeA: "안정추구", b: "미래로 가기", typeB: "모험가" },
            { a: "매일 지각하는 동료와 일하기", typeA: "이상주의", b: "매일 화내는 동료와 일하기", typeB: "현실주의" },
            { a: "무인도에 절친과 가기", typeA: "이상주의", b: "무인도에 생존 전문가와 가기", typeB: "현실주의" },
            { a: "탄산 없는 미지근한 콜라", typeA: "안정추구", b: "치즈 없는 식은 피자", typeB: "모험가" },
            { a: "평생 음악 안 듣기", typeA: "현실주의", b: "평생 영화/드라마 안 보기", typeB: "이상주의" },
            { a: "초능력 투명인간 되기", typeA: "안정추구", b: "초능력 순간이동 하기", typeB: "모험가" }
        ];

        let questions = [];
        let currentQuestionIndex = 0;
        let selectedAnswer = null;
        let selectedType = null;
        let userAnswers = [];
        let typeScores = { "모험가": 0, "안정추구": 0, "현실주의": 0, "이상주의": 0 };

        function shuffleArray(array) {
            let shuffled = array.slice();
            for (let i = shuffled.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
            }
            return shuffled;
        }

        function startGame() {
            questions = shuffleArray(defaultQuestions);
            currentQuestionIndex = 0;
            userAnswers = [];
            typeScores = { "모험가": 0, "안정추구": 0, "현실주의": 0, "이상주의": 0 };
            
            document.getElementById('results-container').style.display = 'none';
            document.getElementById('game-container').style.display = 'flex';
            
            showQuestion();
        }

        function showQuestion() {
            if (currentQuestionIndex >= questions.length) {
                showResults();
                return;
            }

            selectedAnswer = null;
            selectedType = null;
            let q = questions[currentQuestionIndex];
            
            document.getElementById('question-text').innerText = (currentQuestionIndex + 1) + "번째 밸런스!";
            
            let btnA = document.getElementById('btn-a');
            let btnB = document.getElementById('btn-b');
            let nextBtn = document.getElementById('next-btn');

            btnA.innerText = q.a;
            btnB.innerText = q.b;

            btnA.classList.remove('selected', 'dimmed');
            btnB.classList.remove('selected', 'dimmed');
            nextBtn.style.display = 'none';
        }

        function selectChoice(choice) {
            let q = questions[currentQuestionIndex];
            let btnA = document.getElementById('btn-a');
            let btnB = document.getElementById('btn-b');

            if (choice === 'A') {
                selectedAnswer = q.a;
                selectedType = q.typeA;
                
                btnA.classList.add('selected');
                btnA.classList.remove('dimmed');
                btnB.classList.remove('selected');
                btnB.classList.add('dimmed');
            } else {
                selectedAnswer = q.b;
                selectedType = q.typeB;
                
                btnB.classList.add('selected');
                btnB.classList.remove('dimmed');
                btnA.classList.remove('selected');
                btnA.classList.add('dimmed');
            }

            document.getElementById('next-btn').style.display = 'block';
        }

        function nextQuestion() {
            if (!selectedAnswer) return;

            let q = questions[currentQuestionIndex];
            userAnswers.push({
                a: q.a,
                b: q.b,
                picked: selectedAnswer
            });
            
            if(typeScores[selectedType] !== undefined) {
                typeScores[selectedType]++;
            } else {
                typeScores[selectedType] = 1;
            }

            currentQuestionIndex++;
            showQuestion();
        }

        function showResults() {
            document.getElementById('game-container').style.display = 'none';
            let resultsContainer = document.getElementById('results-container');
            let resultsList = document.getElementById('results-list');
            
            resultsContainer.style.display = 'flex';
            resultsList.innerHTML = '';

            // 가장 높은 점수의 성향 찾기
            let topType = "모험가"; // 기본값
            let maxScore = -1;
            for (const [type, score] of Object.entries(typeScores)) {
                if (score > maxScore) {
                    maxScore = score;
                    topType = type;
                }
            }

            // 성향 결과 표시
            let pData = personalityData[topType];
            document.getElementById('personality-title').innerText = "당신의 성향: " + pData.title;
            document.getElementById('personality-desc').innerText = pData.desc;

            // 선택 결과 목록 표시
            userAnswers.forEach((ans, index) => {
                let div = document.createElement('div');
                div.className = 'result-item';
                div.innerHTML = (index + 1) + ". " + ans.a + " <b>VS</b> " + ans.b + " <br>👉 나의 선택: <span>" + ans.picked + "</span>";
                resultsList.appendChild(div);
            });
        }

        function addCustomQuestion() {
            let inputA = document.getElementById('input-a').value.trim();
            let typeA = document.getElementById('type-a').value;
            let inputB = document.getElementById('input-b').value.trim();
            let typeB = document.getElementById('type-b').value;

            if (inputA === "" || inputB === "") {
                alert("선택지 A와 B를 모두 입력해주세요.");
                return;
            }

            defaultQuestions.push({ a: inputA, typeA: typeA, b: inputB, typeB: typeB });
            alert("질문이 추가되었습니다! '다시 하기'를 누르거나 게임을 재시작하면 나옵니다.");
            
            document.getElementById('input-a').value = "";
            document.getElementById('input-b').value = "";
        }

        // 게임 초기 시작
        startGame();
    </script>
</body>
</html>
